<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b9bff"/>
    </marker>
  </defs>
  <rect width="1200" height="260" rx="20" fill="#12151c"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <g transform="translate(30,40)">
      <rect width="240" height="180" rx="14" fill="#1b1f29" stroke="#2c3240" stroke-width="1.5"/>
      <circle cx="34" cy="38" r="17" fill="#4f8cff"/>
      <text x="34" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
      <text x="62" y="45" font-size="20" font-weight="700" fill="#fff">Launch</text>
      <text x="20" y="92" font-size="15" fill="#aeb6c7">from your app menu</text>
      <text x="20" y="114" font-size="15" fill="#aeb6c7">or a terminal</text>
      <text x="20" y="156" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#5fe0a0">$ cc-picker</text>
    </g>
    <!-- card 2 -->
    <g transform="translate(330,40)">
      <rect width="240" height="180" rx="14" fill="#1b1f29" stroke="#2c3240" stroke-width="1.5"/>
      <circle cx="34" cy="38" r="17" fill="#4f8cff"/>
      <text x="34" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
      <text x="62" y="45" font-size="20" font-weight="700" fill="#fff">Pick</text>
      <text x="20" y="92" font-size="15" fill="#aeb6c7">recently used projects</text>
      <text x="20" y="114" font-size="15" fill="#aeb6c7">are listed first</text>
      <text x="20" y="156" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#5fe0a0">my-webapp · 2 h ago</text>
    </g>
    <!-- card 3 -->
    <g transform="translate(630,40)">
      <rect width="240" height="180" rx="14" fill="#1b1f29" stroke="#2c3240" stroke-width="1.5"/>
      <circle cx="34" cy="38" r="17" fill="#4f8cff"/>
      <text x="34" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
      <text x="62" y="45" font-size="20" font-weight="700" fill="#fff">…or create</text>
      <text x="20" y="92" font-size="15" fill="#aeb6c7">a new folder, optionally</text>
      <text x="20" y="114" font-size="15" fill="#aeb6c7">via git clone</text>
      <text x="20" y="156" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#5fe0a0">+ Create new project</text>
    </g>
    <!-- card 4 -->
    <g transform="translate(930,40)">
      <rect width="240" height="180" rx="14" fill="#1b1f29" stroke="#4f8cff" stroke-width="1.5"/>
      <circle cx="34" cy="38" r="17" fill="#5fe0a0"/>
      <text x="34" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1218">4</text>
      <text x="62" y="45" font-size="20" font-weight="700" fill="#fff">Start coding</text>
      <text x="20" y="92" font-size="15" fill="#aeb6c7">a terminal opens in</text>
      <text x="20" y="114" font-size="15" fill="#aeb6c7">the project folder</text>
      <text x="20" y="156" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#5fe0a0">$ claude</text>
    </g>
  </g>

  <g stroke="#5b9bff" stroke-width="3" marker-end="url(#arrow)">
    <line x1="280" y1="130" x2="318" y2="130"/>
    <line x1="580" y1="130" x2="618" y2="130"/>
    <line x1="880" y1="130" x2="918" y2="130"/>
  </g>
</svg>
