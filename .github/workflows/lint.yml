name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n cc-picker.sh install.sh
      - name: ShellCheck
        run: shellcheck cc-picker.sh install.sh
      - name: Smoke test
        run: |
          ./cc-picker.sh --version
          CC_PICKER_LANG=de ./cc-picker.sh --help
          ./cc-picker.sh --help
